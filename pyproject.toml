[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bashmage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
]

[project.scripts]
bashmage = "bashmage.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bashmage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
